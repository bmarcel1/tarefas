<style>

aside{width:250px;flex:none;padding:12px;overflow:auto;border-right:1px solid var(--l);transition:width 0.2s,padding 0.2s;overflow:hidden}
aside.collapsed{width:0!important;padding:0!important;border-right:none}

.hr{height:48px;font-size:10px;color:#70757a;text-align:right;padding-right:6px;transform:translateY(-6px)}

.band{position:absolute;left:0;right:0;pointer-events:none;font-size:10px;padding:2px 4px;color:#5f6368;font-weight:500}

@media(max-width:700px){

<script>

const SUPA_URL='https://hwvuescolygudeoijceo.supabase.co', SUPA_KEY='sb_publishable_6U0-bsmlYQ3ntlC7yUpfnA_Jc0q41d-';
// =========================================================================================
const H=48,MAP={tasks:'tasks',cats:'categories',hist:'history'},$=i=>document.getElementById(i),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2t=m=>p2(Math.floor(m/60))+':'+p2(m%60),t2m=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const db0=()=>({tasks:[],cats:[],hist:[],pend:[],last:null});
let sb,user,db=db0(),cur=new Date(),sel=null,timers=[],poll=0,viewMode='7';
const T=id=>db.tasks.find(t=>t.id==id),C=id=>db.cats.find(c=>c.id==id&&!c.deleted);
const live=()=>db.tasks.filter(t=>!t.deleted),col=id=>(C(id)||{color:'#80868b'}).color;
const newer=(a,b)=>+new Date(a)>+new Date(b);
const save=()=>{try{localStorage.setItem('tf:'+user.id,JSON.stringify(db))}catch(e){}};
const mark=(tb,r)=>{r.updated_at=new Date().toISOString();const k=tb+':'+r.id;if(!db.pend.includes(k))db.pend.push(k)};
const log=(t,action,o,n)=>{const h={id:crypto.randomUUID(),task_id:t.id,title:t.title,action,old_start:o,new_start:n};db.hist.unshift(h);mark('hist',h)};
function commit(){save();render();flush();schedule()}

// ---------- login ----------
async function login(m){
  const e=$('em').value,p=$('pw').value;
  const msg=$('msg');
  msg.textContent=''; msg.className='';
  if(!e||!p){msg.textContent='Preencha e-mail e senha.';msg.className='err';return}
  if(!sb){msg.textContent='Erro de conexão. Tente novamente.';msg.className='err';return}
  
  msg.textContent='Aguarde...'; msg.className='ok';
  
  try {
    let r;
    if (m == 'up') {
      r = await sb.auth.signUp({ 
        email: e, 
        password: p, 
        options: { emailRedirectTo: location.origin + location.pathname } 
      });
    } else {
      r = await sb.auth.signInWithPassword({ email: e, password: p });
    }

    if(r.error){
      msg.textContent=r.error.message; msg.className='err';
    } else if(m=='up'&&!r.data.session){
      msg.textContent='Confirme o e-mail que enviamos.'; msg.className='ok';
    }
  } catch(err) {
    msg.textContent=err.message||'Ocorreu um erro.'; msg.className='err';
  }
}

async function loginGoogle() {
  if (!sb) {
    $('msg').textContent = 'Erro de conexão. Tente novamente mais tarde.';
    $('msg').className = 'err';
    return;
  }
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
  if (error) {
    $('msg').textContent = error.message;
    $('msg').className = 'err';
  }
}

async function logout(){await flush();localStorage.removeItem('tf:'+user.id);sb.auth.signOut()}
function start(s){if(s&&user&&user.id==s.user.id)return;user=s?s.user:null;$('auth').hidden=!!user;$('app').hidden=!user;if(!user)return;
 
 // Limpa a URL (remove o hash com o token) após o login bem-sucedido
 if (window.location.hash.includes('access_token')) {
   history.replaceState(null, null, window.location.pathname);
 }

 try{db={...db0(),...JSON.parse(localStorage.getItem('tf:'+user.id)||'{}')}}catch(e){db=db0()}
 render();pull();if(!poll)poll=setInterval(pull,60000)}

// ---------- sincronização (offline-first) ----------
const APP_V='v10';let pushErr='',pullErr='',lastSync='';
function status(){const n=$('net'),e=pushErr||pullErr;
 n.textContent=!navigator.onLine?'offline':e?'⚠ erro (toque)':db.pend.length?'enviando…':'ok '+lastSync;
 n.style.cursor='pointer';n.onclick=()=>alert((e||'Tudo certo.')+'\nPendentes de envio: '+db.pend.length+'\nÚltima sincronização: '+(lastSync||'—')+'\nVersão do app: '+APP_V)}
async function flush(){if(!user||!navigator.onLine||!db.pend.length)return;pushErr='';
 for(const tb of['cats','tasks','hist']){const ks=db.pend.filter(k=>k.startsWith(tb+':'));if(!ks.length)continue;
  const rows=ks.map(k=>db[tb].find(r=>r.id==k.slice(tb.length+1))).filter(Boolean).map(r=>({...r,user_id:user.id}));
  const{error}=await sb.from(MAP[tb]).upsert(rows);if(error){console.error(error);pushErr='Erro ao enviar '+MAP[tb]+': '+error.message;continue}
  db.pend=db.pend.filter(k=>!ks.includes(k))}save();status()}
async function pull(){if(!user||!navigator.onLine)return;let mx=db.last;const since=db.last?new Date(+new Date(db.last)-6e5).toISOString():null;
 for(const tb of['cats','tasks','hist']){const data=[];for(let from=0;;from+=1000){let q=sb.from(MAP[tb]).select('*');if(since)q=q.gt('updated_at',since);
  q=tb=='hist'?q.order('updated_at',{ascending:false}).limit(100):q.order('updated_at',{ascending:true}).range(from,from+999);
  const{data:d,error}=await q;if(error){pullErr='Erro ao baixar '+MAP[tb]+': '+error.message;status();return}data.push(...d);if(tb=='hist'||d.length<1000)break}
  for(const r of data){delete r.user_id;const i=db[tb].findIndex(x=>x.id==r.id);
   if(i<0)db[tb].push(r);else if(newer(r.updated_at,db[tb][i].updated_at)&&!db.pend.includes(tb+':'+r.id))db[tb][i]=r;
   if(!mx||newer(r.updated_at,mx))mx=r.updated_at}}
 db.last=mx;pullErr='';lastSync=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 commit()}

// ---------- agenda ----------
const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],wd=d=>d.getDay(),dayOK=(c,d)=>((c.days??127)>>wd(d))&1;
const dl=c=>{const d=c.days??127;return d==127?'':d==62?' · Seg–Sex':' · '+DN.filter((_,i)=>d>>i&1).join(',')};
function* wins(ms,c){const L=((c.end_m-c.start_m)%1440+1440)%1440||1440,d0=new Date(ms);d0.setHours(0,0,0,0);
 for(let d=-1;d<900;d++){const w=new Date(d0);w.setDate(w.getDate()+d);if(!dayOK(c,w))continue;w.setHours(0,c.start_m,0,0);
  const ws=+w,we=ws+L*6e4;if(we>ms)yield[ws,we]}}
function* free(s,e,fx){let c=s;for(const[a,b]of fx){if(b<=c)continue;if(a>=e)break;if(a>c)yield[c,a];c=Math.max(c,b);if(c>=e)return}if(c<e)yield[c,e]}
const fxList=()=>live().filter(t=>t.fixed&&t.start&&!t.done).map(t=>{const s=+new Date(t.start);return[s,s+t.dur*6e4]}).sort((a,b)=>a[0]-b[0]);
function segs(ms,dur,c,fx=[]){let rem=dur*6e4;const o=[];
 for(const[ws,we]of(c?wins(ms,c):[[ms,ms+4e11]]))for(const[a,b]of free(Math.max(ms,ws),we,fx)){const k=Math.min(rem,b-a);o.push([a,a+k]);rem-=k;if(rem<=0)return o}
 return o.length?o:[[ms,ms+dur*6e4]]}
const sgOf=x=>{const s=+new Date(x.start);return x.fixed?[[s,s+x.dur*6e4]]:segs(s,x.dur,C(x.cat_id),fxList())};
function slot(ms,dur,c,placed,fx){let sg;for(let i=0;i<600;i++){sg=segs(ms,dur,c,fx);
 const hit=placed.filter(([s,e])=>sg.some(([a,b])=>s<b&&e>a));if(!hit.length)break;ms=hit.sort((x,y)=>x[0]-y[0])[0][1]}
 return{start:sg[0][0],sg}}
function setStart(t,ms,a){const o=t.start;t.start=new Date(ms).toISOString();log(t,a,o,t.start);mark('tasks',t)}
function relayout(first){const fx=fxList(),iso=ms=>new Date(ms).toISOString(),placed=[];
 live().filter(x=>x.start&&!x.done&&!x.fixed).sort((a,b)=>+new Date(a.start)-+new Date(b.start)||(b.id==first)-(a.id==first)).forEach(x=>{
  const s=+new Date(x.start),r=slot(s,x.dur,C(x.cat_id),placed,fx);
  if(r.start!=s){if(x.id==first){x.start=iso(r.start);mark('tasks',x)}else setStart(x,r.start,'remanejada')}placed.push(...r.sg)})}
function move(id,drop){const t=T(id),o=t.start,act=o?'movida':'agendada';t.start=new Date(drop).toISOString();relayout(id);
 log(t,act,o,t.start);mark('tasks',t);commit()}
// volta "min" minutos de tempo útil (janela da categoria, sem as inadiáveis) a partir de ms, atravessando os dias
function back(ms,min,c,fx){let rem=min*6e4;if(!c)return ms-rem;
 const L=((c.end_m-c.start_m)%1440+1440)%1440||1440,d0=new Date(ms);d0.setHours(0,0,0,0);
 for(let d=0;d>-900;d--){const w=new Date(d0);w.setDate(w.getDate()+d);if(!dayOK(c,w))continue;w.setHours(0,c.start_m,0,0);
  const ws=+w,we=Math.min(ws+L*6e4,ms);if(we<=ws)continue;
  for(const[a,b]of[...free(ws,we,fx)].reverse()){if(b-a>=rem)return b-rem;rem-=b-a}}
 return ms}
// tarefa concluída antes do previsto: TODAS as seguintes da mesma categoria sobem o tempo que sobrou (delta, em min),
// mantendo as folgas entre elas. Tarefas recorrentes e inadiáveis não se movem.
function fillGap(t,delta){const fx=fxList(),k=x=>+new Date(x.start),ns=sgOf(t),ms0=ns[ns.length-1][1];
 const others=live().filter(x=>x.start&&!x.done&&!x.fixed&&x.id!=t.id).sort((a,b)=>k(a)-k(b)),cur=new Map(others.map(x=>[x.id,sgOf(x)]));
 const rest=x=>others.filter(y=>y.id!=x.id).flatMap(y=>cur.get(y.id));
 others.filter(x=>k(x)>=k(t)&&(x.cat_id||null)==(t.cat_id||null)&&!x.series_id).forEach(x=>{const c=C(x.cat_id);
  const r=slot(Math.max(back(k(x),delta,c,fx),ms0),x.dur,c,rest(x),fx);
  if(r.start<k(x)-6e4){setStart(x,r.start,'adiantada');cur.set(x.id,r.sg)}})}

function repDates(s,kind,end,days){const out=[new Date(s)];let d=new Date(s);
 for(let i=1;i<800&&out.length<200;i++){
  if(kind=='monthly'){d=new Date(s.getFullYear(),s.getMonth()+i,1,s.getHours(),s.getMinutes());d.setDate(Math.min(s.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  else{d=new Date(d);d.setDate(d.getDate()+(kind=='weekly'?7:1));if(kind=='weekdays'&&wd(d)==0||wd(d)==6)continue;if(kind=='custom'&&!((days>>wd(d))&1))continue}
  if(d>end)break;out.push(new Date(d))}
 return out}

// ---------- week number (Sunday start) ----------
function getWeekNumber(d) {
  const year = d.getFullYear();
  let firstSunday = new Date(year, 0, 1);
  const day = firstSunday.getDay();
  if (day !== 0) {
    firstSunday.setDate(firstSunday.getDate() + (7 - day));
  }
  if (d < firstSunday) {
    const prevYear = year - 1;
    let firstSundayPrev = new Date(prevYear, 0, 1);
    const dayPrev = firstSundayPrev.getDay();
    if (dayPrev !== 0) {
      firstSundayPrev.setDate(firstSundayPrev.getDate() + (7 - dayPrev));
    }
    return Math.floor((d - firstSundayPrev) / 604800000) + 1;
  } else {
    return Math.floor((d - firstSunday) / 604800000) + 1;
  }
}

function renderMonth(){
  const year=cur.getFullYear(), month=cur.getMonth();
  const first=new Date(year, month, 1);
  const startDay=first.getDay(); // 0=Sunday

  let h='<div class="month-grid">';

  for(const d of DN) h+=`<div class="month-header">${d}</div>`;
  // 42 cells
  for(let i=0;i<42;i++){
    const d=new Date(startDate);
    d.setDate(d.getDate()+i);
    const isOther = d.getMonth()!==month;
    const isToday = d.toDateString()==td;
    const dayTasks = live().filter(t=>t.start && new Date(t.start).toDateString()==d.toDateString());
    const taskDots = dayTasks.slice(0,3).map(t=>`<div class="task-item"><span class="dot" style="background:${col(t.cat_id)}"></span>${esc(t.title)}</div>`).join('');
    const more = dayTasks.length>3 ? `<div class="task-item" style="color:#70757a">+${dayTasks.length-3} mais</div>` : '';
    h+=`<div class="month-day${isOther?' other':''}${isToday?' today':''}" data-date="${d.toISOString()}">`
      +`<div class="day-number">${d.getDate()}</div>`
      +taskDots + more
      +`</div>`;

  document.querySelectorAll('.month-day').forEach(el=>{

}

// ---------- diálogos ----------
function getLocalDateTimeParts(isoStr) {
  if (!isoStr) return { date: '', time: '' };
  const d = new Date(isoStr);
  if (isNaN(d)) return { date: '', time: '' };
  const date = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const time = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(11, 16);
  return { date, time };
}

function setQuickDate(when) {
  const d = new Date();
  if (when === 'tomorrow') d.setDate(d.getDate() + 1);
  else if (when === 'nextweek') d.setDate(d.getDate() + 7);
  else if (when === 'today') {
    if (d.getHours() >= 18) d.setDate(d.getDate() + 1); 
  }
  const dateStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('f4_date').value = dateStr;
  if (!$('f4_time').value) {
    $('f4_time').value = when === 'today' ? '18:00' : '09:00';
  }
}

function saveTask(id){
  const title=$('f1').value.trim();if(!title)return;
  const dur=Math.max(5,+$('f2').value||60),cat=$('f3').value||null;
  const notes=$('f9').value.trim()||null; // nota é opcional: sem texto grava vazio (null)
  const dateVal = $('f4_date').value;
  const timeVal = $('f4_time').value;
  let st = '';
  if (dateVal) {
    st = dateVal + 'T' + (timeVal || '12:00');
  }
  const fx=$('f5').checked,rp=$('f6')?$('f6').value:'';
  let rd=0;document.querySelectorAll('.rd').forEach((e,i)=>{if(e.checked)rd|=1<<i});
  
  if(fx&&!st)return alert('Defina o início da tarefa inadiável.');
  if(rp&&!st)return alert('Defina o início para repetir a tarefa.');
  if(rp=='custom'&&!rd)return alert('Escolha ao menos um dia da semana.');
  
  let t=id?T(id):null;
  if(!t){
    t={id:crypto.randomUUID(),title,dur,cat_id:cat,notes,start:null,done:false,deleted:false,fixed:false};
    db.tasks.push(t);log(t,'criada',null,null)
  }
  const ap=$('f8');
  if(ap&&ap.checked&&t.series_id){
    live().filter(x=>x.series_id==t.series_id&&x.id!=t.id&&x.start&&+new Date(x.start)>+new Date(t.start))
    .forEach(x=>{Object.assign(x,{title,dur,cat_id:cat,notes,fixed:fx});mark('tasks',x)});
  }
  Object.assign(t,{title,dur,cat_id:cat,notes,fixed:fx});
  
  if(rp&&!t.series_id){
    const s0=new Date(st),u=$('f7').value,
    end=u?new Date(u+'T23:59'):rp=='monthly'?new Date(s0.getFullYear()+1,s0.getMonth(),s0.getDate(),23,59):new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+90,23,59);
    t.series_id=crypto.randomUUID();
    repDates(s0,rp,end,rd).slice(1).forEach(d=>{
      const x={id:crypto.randomUUID(),title,dur,cat_id:cat,notes,start:d.toISOString(),done:false,deleted:false,fixed:fx,series_id:t.series_id};
      db.tasks.push(x);log(x,'criada',null,x.start);mark('tasks',x)
    })
  }
  mark('tasks',t);$('dg').close();
  if(fx){
    const o=t.start;t.start=new Date(st).toISOString();if(o!=t.start)log(t,o?'movida':'agendada',o,t.start);relayout(null);commit();return
  }
  if(st){
    const ms=+new Date(st);if(!t.start||Math.abs(+new Date(t.start)-ms)>=6e4){move(t.id,ms);return}
  }
  else if(t.start){const o=t.start;t.start=null;log(t,'desagendada',o,null)}
  relayout(t.id);commit()
}

 $('dg').innerHTML=`<h3>Concluir tarefa</h3><p>${esc(t.title)}</p><small>Quanto tempo levou? (previsto: ${t.dur} min)</small>
 <input id="d1" type="number" min="1" max="${t.dur}" value="${w}"><small>Se foi menos que o previsto, as próximas tarefas sobem para ocupar o tempo livre.</small>

 const n=Date.now();live().filter(t=>t.start&&!t.done).forEach(t=>{const d=sgOf(t)[0][0]-10*6e4-n;if(d>0&&d<864e5)timers.push(setTimeout(()=>notify(t),d))})}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
addEventListener('online',()=>{pull();flush()});addEventListener('offline',render);addEventListener('resize',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('focus',pull);addEventListener('pageshow',pull);

// Tratamento de erros vindos do link de confirmação de e-mail
if (window.location.hash.includes('error=')) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const err = params.get('error_description');
    if (err) {
        document.getElementById('msg').textContent = err.replace(/\+/g, ' ');
        document.getElementById('msg').className = 'err';
        history.replaceState(null, null, window.location.pathname); // limpa a URL
    }
}

if (typeof supabase !== 'undefined') {
  sb = supabase.createClient(SUPA_URL, SUPA_KEY, { global: { fetch: (u, o) => fetch(u, { ...o, cache: 'no-store' }) } });
  sb.auth.getSession().then(({ data }) => start(data.session));
  sb.auth.onAuthStateChange((e, s) => { 
    if (e == 'SIGNED_OUT') { user = null; start(null); } 
    else if (e == 'SIGNED_IN') start(s); 
  });
} else {
  document.getElementById('msg').textContent = 'Erro: Biblioteca Supabase não carregada.';
  document.getElementById('msg').className = 'err';
}
</script></body></html>
